# Cloudflare Worker for The Fort's anonymous analytics (see README.md). Deployed 2026-10-05.
name = "fort-analytics"
main = "worker.js"
compatibility_date = "2026-09-01"

# Never log request details (IP, headers) in Workers Logs.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "fort-analytics"
database_id = "4df39b2d-61e9-4ad4-9b51-e31ca774c098"
